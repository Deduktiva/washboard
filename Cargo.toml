[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/washboard-core",
    "crates/washboard-ui-model",
    "crates/washboard-cli",
    "crates/libxml2-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
washboard-core = { path = "crates/washboard-core" }
libxml2-sys = { path = "crates/libxml2-sys" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2
