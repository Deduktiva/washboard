[package]
name = "washboard-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "washboard_app"

[[bin]]
name = "washboard-app"
path = "src/main.rs"

# AppKit has to run on the main thread; libtest runs tests on worker threads.
[[test]]
name = "appkit"
harness = false

[dependencies]
washboard-core.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6.2"

# `cargo packager --release -p washboard-app` from the workspace root builds `Washboard.app` in
# `target/packager/` (PLAN §2 "Packaging"). Paths are relative to this crate: cargo-packager
# changes into it. The binary is copied to `Washboard` in a directory of its own because on
# case-insensitive APFS it would overwrite the CLI (`washboard`) in `target/release/`.
[package.metadata.packager]
product-name = "Washboard"
identifier = "at.deduktiva.washboard"
formats = ["app"]
before-packaging-command = """
MACOSX_DEPLOYMENT_TARGET=26.0 cargo build --release -p washboard-app \
&& mkdir -p ../../target/packager/bin \
&& cp ../../target/release/washboard-app ../../target/packager/bin/Washboard"""
binaries-dir = "../../target/packager/bin"
binaries = [{ path = "Washboard", main = true }]
out-dir = "../../target/packager"
icons = ["icons/icon.png"]
macos = { minimum-system-version = "26.0" }
