name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  deny:
    name: cargo deny (banned crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Bans only (deny.toml, PLAN §6); the dependency-graph and source checks for the network
      # boundary run as tests (crates/washboard-core/tests/network_boundary.rs).
      - run: cargo deny check bans

  fixtures:
    name: Fixture oracle (lxml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script fixtures/check_fixtures.py

  macos:
    name: macOS (clippy, tests, app bundle)
    # Pinned: the minimum OS is macOS 26 (PLAN §1), and the app checks must run on it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Also lints the macOS-only code (app, Keychain) that the Linux job never compiles.
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      # Builds target/packager/Washboard.app from crates/washboard-app/Cargo.toml (PLAN §2
      # "Packaging"); unsigned.
      - run: cargo packager --release -p washboard-app
      - name: Check Info.plist
        run: |
          plist=target/packager/Washboard.app/Contents/Info.plist
          plutil -lint "$plist"
          test "$(plutil -extract CFBundleExecutable raw "$plist")" = Washboard
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = at.deduktiva.washboard
          test "$(plutil -extract LSMinimumSystemVersion raw "$plist")" = 26.0
          test -x target/packager/Washboard.app/Contents/MacOS/Washboard
      - uses: actions/upload-artifact@v4
        with:
          name: Washboard.app
          path: target/packager/Washboard.app
