name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (fmt, clippy incl. macOS target, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # Lints the macOS code here instead of on the slower macOS runner. washboard-core's test
      # targets are left out: their TLS dev-dependencies compile C for the target, which needs a
      # macOS SDK. The env var keeps SQLite from compiling its bundled C for the same reason.
      - name: cargo clippy (aarch64-apple-darwin)
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: 1
        run: |
          cargo clippy --target aarch64-apple-darwin --workspace --exclude washboard-core --all-targets
          cargo clippy --target aarch64-apple-darwin -p washboard-core --lib
      - run: cargo test --workspace

  deny:
    name: cargo deny (banned crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Bans only (deny.toml, docs/specs/network.md); the dependency-graph and source checks for the
      # network boundary run as tests (crates/washboard-core/tests/network_boundary.rs).
      - run: cargo deny check bans

  fixtures:
    name: Fixture oracle (lxml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script fixtures/check_fixtures.py

  macos:
    name: macOS (tests, app bundle)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - run: cargo packager --release -p washboard-app
