name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (core, cli, macOS type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Type-check the macOS app
        # No macOS SDK on Linux: bundled C libraries can't be compiled for the Apple target.
        # rusqlite's `bundled` build is switched to pkg-config for this type-check only;
        # libxml2-sys skips its C build by itself when cross-checking for macOS.
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
        run: cargo clippy -p washboard-app --target aarch64-apple-darwin

  fixtures:
    name: Fixture oracle (lxml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script fixtures/check_fixtures.py

  macos:
    name: macOS (build + test everything)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
